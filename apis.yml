name: Hexafarms
description: >-
  Hexafarms GmbH is a Berlin-based agricultural technology company that builds
  AI-powered greenhouse optimization software for commercial growers. Its
  platform combines computer vision, environmental sensors, and machine learning
  to help greenhouse and foil-tunnel operations forecast yield, register crops,
  and detect pests and disease early. Products include AI yield forecasting
  (claimed up to 20% more accurate than traditional methods), automated crop
  registration via fruit and flower counting, pest and disease monitoring, and
  environmental sensing across crops such as strawberries, tomatoes, bell
  peppers, blueberries, cucumbers, raspberries, and aubergine. The product is
  delivered as a login-gated web application at hexafarms.app; no public developer
  API or documentation surface has been identified. Hexafarms was surfaced as a
  portfolio company of Speedinvest and added to the API Evangelist network.
